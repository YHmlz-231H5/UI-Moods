<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logistics · 物流快递 — UI Moods App Reference</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: var(--mood-colors-bg);
      color: var(--mood-colors-text);
      font-family: var(--mood-typography-family);
      font-size: var(--mood-typography-body-size);
      line-height: 1.7;
    }
    h1 { font-size: var(--mood-typography-display-size); color: var(--mood-colors-text-strong); margin: 0 0 6px; }
    p.lead { color: var(--mood-colors-muted); margin: 0 0 24px; max-width: 640px; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
    li {
      padding: 14px 18px;
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-card);
      background: var(--mood-colors-surface);
      box-shadow: var(--mood-shadows-card);
    }
    a { color: var(--mood-colors-accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    li span { color: var(--mood-colors-muted); margin-left: 6px; }
    li em { display: block; font-style: normal; font-size: var(--mood-typography-label-size); color: var(--mood-colors-muted); margin-top: 4px; }
  </style>
  <style id="mood-tokens">
    :root {
      --mood-colors-bg: #06111c;
      --mood-colors-panel: rgba(255,255,255,0.05);
      --mood-colors-surface: rgba(120,220,255,0.10);
      --mood-colors-text: #d6e8f2;
      --mood-colors-text-strong: #ffffff;
      --mood-colors-muted: #7f9fb0;
      --mood-colors-border: rgba(255,255,255,0.14);
      --mood-colors-accent: #5eead4;
      --mood-colors-on-accent: #04202a;
      --mood-colors-ok: #4ade80;
      --mood-colors-warn: #fcd34d;
      --mood-colors-danger: #fb7185;
      --mood-typography-family: Outfit, Inter, system-ui, sans-serif;
      --mood-typography-display-size: 42px;
      --mood-typography-title-size: 16px;
      --mood-typography-body-size: 14px;
      --mood-typography-label-size: 12px;
      --mood-radii-block: 12px;
      --mood-radii-button: 10px;
      --mood-radii-card: 18px;
      --mood-radii-badge: 999px;
      --mood-radii-input: 10px;
      --mood-borders-width: 1px;
      --mood-borders-style: solid;
      --mood-effects-backdrop-filter: blur(14px);
      --mood-effects-glow: 0 0 30px rgba(94,234,212,0.4);
      --mood-shadows-card: 0 14px 44px rgba(0,20,40,0.6);
      --mood-shadows-button: 0 0 16px rgba(94,234,212,0.3);
      --mood-spacing-section: 30px;
      --mood-spacing-block: 20px;
      --mood-spacing-gap: 14px;
      --mood-motion-duration: 0.4s;
      --mood-motion-easing: cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <h1>Logistics · 物流快递</h1>
  <p class="lead">货运与快递服务参考：运单查询、路线跟踪、签收确认与异常处理。</p>
  <ul>
<li><a href="./track.html">运单查询</a> <span>查件</span></li>
<li><a href="./route.html">路线跟踪</a> <span>轨迹</span></li>
<li><a href="./delivery.html">签收确认</a> <span>签收</span></li>
<li><a href="./exception.html">异常处理</a> <span>异常</span></li>
  </ul>
</body>
</html>
