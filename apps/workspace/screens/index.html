<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workspace · 效率办公 — UI Moods App Reference</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: var(--mood-colors-bg);
      color: var(--mood-colors-text);
      font-family: var(--mood-typography-family);
      font-size: var(--mood-typography-body-size);
      line-height: 1.7;
    }
    h1 { font-size: var(--mood-typography-display-size); color: var(--mood-colors-text-strong); margin: 0 0 6px; }
    p.lead { color: var(--mood-colors-muted); margin: 0 0 24px; max-width: 640px; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
    li {
      padding: 14px 18px;
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-card);
      background: var(--mood-colors-surface);
      box-shadow: var(--mood-shadows-card);
    }
    a { color: var(--mood-colors-accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    li span { color: var(--mood-colors-muted); margin-left: 6px; }
    li em { display: block; font-style: normal; font-size: var(--mood-typography-label-size); color: var(--mood-colors-muted); margin-top: 4px; }
  </style>
  <style id="mood-tokens">
    :root {
      --mood-colors-bg: #f2f2f7;
      --mood-colors-panel: #e9e9ee;
      --mood-colors-surface: rgba(255,255,255,0.72);
      --mood-colors-text: #3c3c43;
      --mood-colors-text-strong: #1c1c1e;
      --mood-colors-muted: #8e8e93;
      --mood-colors-border: rgba(60,60,67,0.12);
      --mood-colors-accent: #007aff;
      --mood-colors-on-accent: #ffffff;
      --mood-colors-ok: #34c759;
      --mood-colors-warn: #ff9500;
      --mood-colors-danger: #ff3b30;
      --mood-typography-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif;
      --mood-typography-display-size: 44px;
      --mood-typography-title-size: 15px;
      --mood-typography-body-size: 13px;
      --mood-typography-label-size: 11px;
      --mood-radii-block: 16px;
      --mood-radii-button: 12px;
      --mood-radii-card: 18px;
      --mood-radii-badge: 999px;
      --mood-radii-input: 10px;
      --mood-borders-width: 1px;
      --mood-borders-style: solid;
      --mood-effects-backdrop-filter: blur(18px);
      --mood-shadows-card: 0 10px 30px rgba(28,28,30,0.08);
      --mood-shadows-button: 0 1px 2px rgba(28,28,30,0.06);
      --mood-spacing-section: 28px;
      --mood-spacing-block: 18px;
      --mood-spacing-gap: 12px;
      --mood-motion-duration: 0.2s;
      --mood-motion-easing: ease;
    }
  </style>
</head>
<body>
  <h1>Workspace · 效率办公</h1>
  <p class="lead">协作工作台参考：任务看板、日历排期、文档协作、团队效能与消息通知。</p>

<li><a href="./tasks.html">任务看板</a> <span>任务</span></li>
<li><a href="./calendar.html">日历排期</a> <span>日程</span></li>
<li><a href="./docs.html">文档协作</a> <span>文档</span></li>
<li><a href="./team.html">团队统计</a> <span>数据</span></li>
<li><a href="./inbox.html">消息通知</a> <span>消息</span></li>
  </ul>
</body>
</html>
