<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social · 社交社区 — UI Moods App Reference</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: var(--mood-colors-bg);
      color: var(--mood-colors-text);
      font-family: var(--mood-typography-family);
      font-size: var(--mood-typography-body-size);
      line-height: 1.7;
    }
    h1 { font-size: var(--mood-typography-display-size); color: var(--mood-colors-text-strong); margin: 0 0 6px; }
    p.lead { color: var(--mood-colors-muted); margin: 0 0 24px; max-width: 640px; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
    li {
      padding: 14px 18px;
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-card);
      background: var(--mood-colors-surface);
      box-shadow: var(--mood-shadows-card);
    }
    a { color: var(--mood-colors-accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    li span { color: var(--mood-colors-muted); margin-left: 6px; }
    li em { display: block; font-style: normal; font-size: var(--mood-typography-label-size); color: var(--mood-colors-muted); margin-top: 4px; }
  </style>
  <style id="mood-tokens">
    :root {
      --mood-colors-bg: #fdf6f8;
      --mood-colors-panel: #ffffff;
      --mood-colors-surface: #f7eef5;
      --mood-colors-text: #4a4458;
      --mood-colors-text-strong: #2f2b3d;
      --mood-colors-muted: #918b9e;
      --mood-colors-border: #e8dfe6;
      --mood-colors-accent: #b8a1e3;
      --mood-colors-on-accent: #ffffff;
      --mood-colors-ok: #a8d5ba;
      --mood-colors-warn: #f6d6ad;
      --mood-colors-danger: #f2a1a1;
      --mood-typography-family: Quicksand, Nunito, system-ui, sans-serif;
      --mood-typography-display-size: 40px;
      --mood-typography-title-size: 17px;
      --mood-typography-body-size: 14px;
      --mood-typography-label-size: 11px;
      --mood-radii-block: 14px;
      --mood-radii-button: 999px;
      --mood-radii-card: 20px;
      --mood-radii-badge: 999px;
      --mood-radii-input: 12px;
      --mood-borders-width: 1px;
      --mood-borders-style: solid;
      --mood-effects-backdrop-filter: blur(8px);
      --mood-effects-glow: none;
      --mood-shadows-card: 0 10px 30px rgba(120,100,140,0.10);
      --mood-shadows-button: 0 4px 12px rgba(120,100,140,0.12);
      --mood-spacing-section: 28px;
      --mood-spacing-block: 18px;
      --mood-spacing-gap: 12px;
      --mood-motion-duration: 0.3s;
      --mood-motion-easing: ease-out;
    }
  </style>
</head>
<body>
  <h1>Social · 社交社区</h1>
  <p class="lead">兴趣社区应用参考：动态信息流与话题互动、话题详情与讨论、私信会话列表以及个人主页与作品集。</p>
  <ul>
<li><a href="./feed.html">动态信息流</a> <span>首页</span></li>
<li><a href="./topic.html">话题详情</a> <span>话题</span></li>
<li><a href="./messages.html">消息会话</a> <span>消息</span></li>
<li><a href="./profile.html">个人主页</a> <span>我的</span></li>
  </ul>
</body>
</html>
