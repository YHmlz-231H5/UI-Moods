# neon · acceptance checklist

- id: neon-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "12px"

- id: neon-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: neon-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: neon-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: neon-backdrop
  type: value
  description: Panels use a glowing backdrop blur
  assert:
    path: effects.backdropFilter
    eq: "blur(12px)"

- id: neon-feel
  type: subjective
  description: Magenta bloom on near-black reads as lit signage after dark
  required: false
