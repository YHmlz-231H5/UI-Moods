# pastel · acceptance checklist

- id: pastel-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "20px"

- id: pastel-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: pastel-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: pastel-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: pastel-backdrop
  type: value
  description: Panels use a soft frosted backdrop blur
  assert:
    path: effects.backdropFilter
    eq: "blur(8px)"

- id: pastel-feel
  type: subjective
  description: Low-saturation tints and round forms read as calm and welcoming
  required: false
