# eco · acceptance checklist

- id: eco-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "16px"

- id: eco-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: eco-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: eco-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: eco-backdrop
  type: value
  description: Panels use a soft botanical blur
  assert:
    path: effects.backdropFilter
    eq: "blur(6px)"

- id: eco-feel
  type: subjective
  description: Panels feel organic, fresh and gently translucent
  required: false
