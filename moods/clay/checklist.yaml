# clay · acceptance checklist

- id: clay-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "18px"

- id: clay-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: clay-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: clay-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: clay-radius-pill
  type: value
  description: Button radius must be pill-shaped per tokens
  assert:
    path: radii.button
    eq: "999px"

- id: clay-feel
  type: subjective
  description: Panels feel soft, matte and tactile like molded clay
  required: false
