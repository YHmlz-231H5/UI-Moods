# luxury · acceptance checklist

- id: luxury-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "0"

- id: luxury-font
  type: value
  description: Body font must be the serif family from tokens
  assert:
    path: typography.family
    eq: "Cormorant Garamond, Georgia, serif"

- id: luxury-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: luxury-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: luxury-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: luxury-feel
  type: subjective
  description: Panels feel editorial and restrained with hairline rules
  required: false
