# vaporwave · acceptance checklist

- id: vaporwave-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "12px"

- id: vaporwave-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: vaporwave-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: vaporwave-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: vaporwave-backdrop
  type: value
  description: Panels use a soft neon blur
  assert:
    path: effects.backdropFilter
    eq: "blur(10px)"

- id: vaporwave-feel
  type: subjective
  description: Interface reads as a neon sunset with violet field, magenta halo and drifting blurred panels
  required: false
