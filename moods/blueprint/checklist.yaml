# blueprint · acceptance checklist

- id: blueprint-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "0"

- id: blueprint-font
  type: value
  description: Body font must be the condensed family from tokens
  assert:
    path: typography.family
    eq: "Barlow Condensed, 'Space Grotesk', sans-serif"

- id: blueprint-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: blueprint-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: blueprint-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: blueprint-feel
  type: subjective
  description: Panels read as drafting paper with white ink lines
  required: false
