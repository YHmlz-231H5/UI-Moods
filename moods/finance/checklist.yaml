# finance · acceptance checklist

- id: finance-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "10px"

- id: finance-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: finance-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: finance-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: finance-feel
  type: subjective
  description: Panels feel restrained, premium and precise like a private ledger
  required: false
