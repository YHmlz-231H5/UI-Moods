# night · acceptance checklist

- id: night-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "8px"

- id: night-font
  type: value
  description: Body font must be the monospace family from tokens
  assert:
    path: typography.family
    eq: "IBM Plex Mono, ui-monospace, monospace"

- id: night-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: night-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: night-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: night-feel
  type: subjective
  description: Panels glow softly like instruments in the dark
  required: false
