# y2k · acceptance checklist

- id: y2k-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "24px"

- id: y2k-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: y2k-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: y2k-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: y2k-backdrop
  type: value
  description: Panels use a soft chrome backdrop blur
  assert:
    path: effects.backdropFilter
    eq: "blur(10px)"

- id: y2k-feel
  type: subjective
  description: Pill shapes, violet glow and springy overshoot read as early-2000s chrome
  required: false
