# archive · acceptance checklist

- id: archive-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "3px"

- id: archive-font
  type: value
  description: Body font must be the serif family from tokens
  assert:
    path: typography.family
    eq: "Newsreader, Georgia, serif"

- id: archive-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: archive-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: archive-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: archive-feel
  type: subjective
  description: Panels read as paper and ink with stamp-like accents
  required: false
