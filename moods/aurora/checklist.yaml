# aurora · acceptance checklist

- id: aurora-radius-card
  type: value
  description: Card radius must equal tokens.radii.card
  assert:
    path: radii.card
    eq: "18px"

- id: aurora-token-only-colors
  type: token-only
  description: No color literals outside tokens.colors / resolved components
  scope: colors

- id: aurora-token-only-components
  type: token-only
  description: Component semantic layer must only reference tokens, no new literals
  scope: components

- id: aurora-contrast-text
  type: contrast
  description: Body text on bg contrast >= 4.5:1
  foreground: colors.text
  background: colors.bg
  minRatio: 4.5

- id: aurora-backdrop
  type: value
  description: Panels use a deep aurora blur
  assert:
    path: effects.backdropFilter
    eq: "blur(14px)"

- id: aurora-feel
  type: subjective
  description: Interface reads as a cold night sky with deep blue base, mint-teal glow and translucent drifting surfaces
  required: false
