<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · text-only (M3 · scenario 1)</title>
  <!--
    Scenario 1 · text-only
    Input: "做一个设置页。深色背景，毛玻璃半透明卡片，紫色系高光，
    圆角现代感，字体现代无衬线。包含：资料表单（姓名、邮箱、备注）、
    保存/取消/删除账户按钮、Active 状态徽章、62% 进度条、一条提示信息。"
    No tokens, no bundle, no AGENTS.md. Values are guesses.
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(150deg, #0e0e1f, #151527 70%);
      color: #e2e2f5;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px 24px;
      display: flex;
      justify-content: center;
    }
    main { width: min(560px, 100%); display: flex; flex-direction: column; gap: 18px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { margin: 0 0 12px; color: #9aa0c8; font-size: 13px; }
    .card {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 36px rgba(5,5,20,0.35);
    }
    .card h2 { margin: 0 0 14px; font-size: 16px; }
    label { display: block; font-size: 12px; color: #9aa0c8; margin: 0 0 10px; }
    input, textarea {
      display: block; width: 100%; margin-top: 5px;
      font: inherit; padding: 9px 11px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 12px;
      color: #fff;
      outline: none;
    }
    textarea { min-height: 70px; resize: vertical; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    button {
      font: inherit; padding: 9px 18px; cursor: pointer;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.1);
      color: #d8d8f0;
    }
    button.primary {
      background: linear-gradient(135deg, #6c63ff, #38bdf8);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }
    button.danger { color: #fb7185; border-color: rgba(251,113,133,0.5); background: transparent; }
    .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden; margin: 6px 0 12px; }
    .bar i { display: block; height: 100%; width: 62%; border-radius: 999px; background: linear-gradient(90deg, #6c63ff, #38bdf8); }
    .badge {
      display: inline-block; font-size: 11px; padding: 4px 12px;
      border-radius: 999px;
      background: rgba(138,123,255,0.25);
      color: #d8d2ff;
    }
    .alert {
      display: flex; gap: 10px; padding: 12px 14px;
      background: rgba(138,123,255,0.18);
      border: 1px solid rgba(138,123,255,0.4);
      border-radius: 14px;
      font-size: 13px;
    }
    .alert .mark { opacity: 0.7; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>设置</h1>
    <p class="sub">管理你的个人资料与账户</p>
    <section class="card">
      <h2>个人资料</h2>
      <label>姓名<input value="林一" /></label>
      <label>邮箱<input type="email" value="linyi@example.com" /></label>
      <label>备注<textarea>喜欢玻璃质感的界面</textarea></label>
      <div class="actions"><button class="primary">保存</button><button>取消</button></div>
    </section>
    <section class="card">
      <h2>资料完整度</h2>
      <div class="bar"><i></i></div>
      <span class="badge">Active</span>
    </section>
    <section class="card">
      <h2>危险区</h2>
      <p style="font-size:13px;color:#9aa0c8;margin:0 0 12px">删除后不可恢复，请谨慎操作。</p>
      <button class="danger">删除账户</button>
    </section>
    <div class="alert"><span class="mark">NOTE</span><span>设置已保存</span></div>
  </main>
</body>
</html>
