<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · bundle (M3 · scenario 2)</title>
  <!--
    Scenario 2 · bundle
    Input: glass.prompt.md (ui-moods bundle glass) + the shared requirement.
    style: mood/glass@1.0.0
    Every color/radius/shadow/effect below is an exact tokens value.
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0f1023;                 /* colors.bg */
      color: #d8d8f0;                      /* colors.text */
      font-family: "Space Grotesk", system-ui, sans-serif; /* meta.fonts */
      font-size: 13px;                     /* typography.bodySize */
      padding: 40px 24px;
      display: flex;
      justify-content: center;
    }
    main { width: min(560px, 100%); display: flex; flex-direction: column; gap: 18px; }
    h1 { margin: 0 0 4px; font-size: 44px; color: #ffffff; font-weight: 600; letter-spacing: -0.01em; }
    .sub { margin: 0 0 12px; color: #9aa0c8; }  /* colors.muted */
    .card {
      background: rgba(255,255,255,0.14);  /* colors.surface */
      border: 1px solid rgba(255,255,255,0.18); /* colors.border */
      border-radius: 20px;                 /* radii.card */
      padding: 18px;                       /* spacing.block */
      box-shadow: 0 12px 36px rgba(5,5,20,0.4); /* shadows.card */
      backdrop-filter: blur(16px);         /* effects.backdropFilter */
    }
    .card h2 { margin: 0 0 14px; font-size: 16px; color: #ffffff; } /* typography.titleSize / textStrong */
    label { display: block; font-size: 11px; color: #9aa0c8; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    input, textarea {
      display: block; width: 100%; margin-top: 5px;
      font: inherit; padding: 9px 12px;
      background: rgba(255,255,255,0.08);  /* colors.panel */
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;                 /* radii.input */
      color: #ffffff;
      outline: none;
    }
    textarea { min-height: 70px; resize: vertical; }
    .actions { display: flex; gap: 12px; margin-top: 14px; }
    button {
      font: inherit; padding: 9px 17px; cursor: pointer;
      border-radius: 12px;                 /* radii.button */
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent;
      color: #d8d8f0;
    }
    button.primary {
      background: #8b7bff;                 /* colors.accent */
      color: #0b0b18;                      /* colors.onAccent */
      border-color: #8b7bff;
      font-weight: 600;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16); /* shadows.button */
    }
    button.danger {
      color: #fb7185;                      /* colors.danger */
      border-color: #fb7185;
      background: transparent;
    }
    .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.18); overflow: hidden; margin: 6px 0 12px; }
    .bar i { display: block; height: 100%; width: 62%; border-radius: 999px; background: #8b7bff; } /* colors.accent */
    .badge {
      display: inline-block; font-size: 11px; padding: 4px 12px;
      border-radius: 999px;                /* radii.badge */
      background: #8b7bff;
      color: #0b0b18;
    }
    .alert {
      display: flex; gap: 10px; padding: 12px 14px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;                 /* radii.block */
      font-size: 13px;
      color: #d8d8f0;
      backdrop-filter: blur(16px);
    }
    .alert .mark { opacity: 0.8; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>设置</h1>
    <p class="sub">管理你的个人资料与账户</p>
    <section class="card">
      <h2>个人资料</h2>
      <label>姓名<input value="林一" /></label>
      <label>邮箱<input type="email" value="linyi@example.com" /></label>
      <label>备注<textarea>喜欢玻璃质感的界面</textarea></label>
      <div class="actions"><button class="primary">保存</button><button>取消</button></div>
    </section>
    <section class="card">
      <h2>资料完整度</h2>
      <div class="bar"><i></i></div>
      <span class="badge">Active</span>
    </section>
    <section class="card">
      <h2>危险区</h2>
      <p style="font-size:13px;color:#9aa0c8;margin:0 0 12px">删除后不可恢复，请谨慎操作。</p>
      <button class="danger">删除账户</button>
    </section>
    <div class="alert"><span class="mark">NOTE</span><span>设置已保存</span></div>
  </main>
</body>
</html>
