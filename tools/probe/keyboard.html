<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ui-moods · keyboard probe</title>

<!-- The probe is a measuring instrument, not a page anybody looks at. It
     loads every component's live examples and asks each control the three
     questions a keyboard reader would ask: can you name it, can you reach
     it, and can you see where you are.

     Open this page by hand and press Tab once before reading the summary.
     The browser paints a focus ring only when the last thing the reader did
     was press a key, and the driver that runs this probe in a pipeline does
     exactly that. -->

<style>
  /* The probe paints itself the way a real page does: the page background and
     the body colour come from the theme's own variables. A probe with a
     hard-coded white body would measure every mood against white, which is
     the one surface the library never promised anything about. */
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 16px; background: var(--um-bg-page); color: var(--um-text-regular); }
  h1 { font-size: 15px; margin: 0 0 8px; color: var(--um-text-primary); }
  #summary { font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; color: var(--um-text-regular); }
  #report { font-size: 11px; border-collapse: collapse; width: 100%; }
  #report th, #report td { border: 1px solid var(--um-border-base); padding: 3px 6px; text-align: left; vertical-align: top; }
  #report th { background: var(--um-fill-light); color: var(--um-text-primary); position: sticky; top: 0; }
  .fail { background: var(--um-color-danger-soft-4); }
  #stage { position: absolute; left: -99999px; top: 0; width: 1200px; background: var(--um-bg-page); }
  #stage * { content-visibility: visible !important; }
  #stage *, #stage *::before, #stage *::after { transition: none !important; animation: none !important; }
</style>
</head>
<body>

<h1>ui-moods · keyboard probe</h1>
<div id="summary">running…</div>
<table id="report"><thead><tr><th>theme</th><th>component</th><th>check</th><th>element</th><th>detail</th></tr></thead><tbody></tbody></table>

<div id="stage"></div>

<script type="module">
import { measureKeyboard } from "./keyboard-measure.js";

const report = await measureKeyboard();

const tbody = document.querySelector("#report tbody");
for (const row of report.rows) {
  const tr = document.createElement("tr");
  tr.className = "fail";
  for (const key of ["theme", "component", "check", "element", "detail"]) {
    const td = document.createElement("td");
    td.textContent = String(row[key] ?? "");
    tr.append(td);
  }
  tbody.append(tr);
}

document.getElementById("summary").textContent =
  `components: 83\n` +
  `themes: 32\n` +
  `focusable controls: ${report.focusables}\n` +
  `controls with a name: ${report.named}\n` +
  `focus rings the browser painted: ${report.focusVisible}\n` +
  `keyboard mode: ${report.keyboard ? "yes" : "no — press Tab and open the page again"}\n` +
  `failures: ${report.rows.length}\n` +
  (report.rows.length
    ? "\n" +
      report.rows
        .slice(0, 40)
        .map((r) => `${r.theme} ${r.component} ${r.check} ${r.element} ${r.detail}`)
        .join("\n")
    : "");

window.__PROBE__ = report;
document.title = `probe · ${report.focusables} controls · ${report.rows.length} failures`;
</script>
</body>
</html>
