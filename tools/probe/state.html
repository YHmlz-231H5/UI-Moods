<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ui-moods · state probe</title>

<!-- The probe is a measuring instrument, not a page anybody looks at. It
     asks one question of every component: does the state the reader picks
     actually show?

     A state that paints nothing is a defect no other instrument in this
     repository can see. The stylesheet is valid, so the validity probe has
     nothing to report. The colours are the right colours, so the contrast
     probe has nothing to report. The boxes are where they were asked to be,
     so the geometry probe has nothing to report. And yet the reader picks the
     third star of a rating and the third star looks exactly like the second
     one, because the rule that was supposed to fill it was thrown away by
     the browser — or was overridden by a later rule, or lost a specificity
     fight. Every measurement passes and the component does not work.

     So this one compares a selected thing with an unselected one of the same
     kind and asks whether the reader could tell them apart. The comparison is
     a signature: the paint of the box and of everything inside it, including
     its pseudo-elements, because a check mark is drawn with a border and a
     transform and there is no text anywhere near it.

     A twin that is itself in some state — selected, or disabled — is not
     counted as unselected. -->

<link rel="stylesheet" href="/components/um-components.css" />
<link rel="stylesheet" href="/themes/all.css" />

<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 16px; background: var(--um-bg-page); color: var(--um-text-regular); }
  h1 { font-size: 15px; margin: 0 0 8px; color: var(--um-text-primary); }
  #summary { font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; color: var(--um-text-regular); }
  #report { font-size: 11px; border-collapse: collapse; width: 100%; }
  #report th, #report td { border: 1px solid var(--um-border-base); padding: 3px 6px; text-align: left; vertical-align: top; }
  #report th { background: var(--um-fill-light); color: var(--um-text-primary); position: sticky; top: 0; }
  .fail { background: var(--um-color-danger-soft-4); }
  #stage { position: absolute; left: -99999px; top: 0; width: 1200px; background: var(--um-bg-page); }
  #stage * { content-visibility: visible !important; }
  #stage *, #stage *::before, #stage *::after { transition: none !important; animation: none !important; }
</style>
</head>
<body>

<h1>ui-moods · state probe</h1>
<div id="summary">running…</div>
<table id="report"><thead><tr><th>component</th><th>check</th><th>element</th><th>detail</th></tr></thead><tbody></tbody></table>

<div id="stage"></div>

<script type="module">
// --- what a state is made of -------------------------------------------------

/**
 * The paint of a box: what the reader would see of it.
 *
 * The signature is taken over the box and everything inside it, and over
 * their pseudo-elements, because the library draws its shapes rather than
 * types them. A check mark is a border and a rotation; a chevron is a border
 * and a rotation; an arrow is two borders. None of them carries a character,
 * so a signature that stops at the text would find every one of them empty.
 */
function signature(el) {
  const props = [
    "opacity",
    "background-color",
    "background-image",
    "color",
    "border-top-color",
    "border-right-color",
    "border-bottom-color",
    "border-left-color",
    "outline-color",
    "box-shadow",
    "visibility",
    "transform",
    "filter",
    "text-decoration-line",
  ];
  const parts = [];
  const read = (node, pseudo) => {
    const cs = getComputedStyle(node, pseudo);
    for (const p of props) parts.push(`${p}=${cs.getPropertyValue(p)}`);
  };
  read(el, null);
  read(el, "::before");
  read(el, "::after");
  for (const d of el.querySelectorAll("*")) {
    read(d, null);
    read(d, "::before");
    read(d, "::after");
  }
  return parts.join("|");
}

/** The tag and classes of an element, for the report. */
function label(el) {
  const cls = (el.className || "").toString().trim().split(/\s+/).filter(Boolean).join(".");
  return el.tagName.toLowerCase() + (cls ? "." + cls : "");
}

/**
 * The box that carries a control's state to the reader.
 *
 * The control itself is usually invisible — a radio hidden by size and
 * opacity so it keeps its place in the tab order — so the state is carried
 * by something else: the label the control is tied to, or the box the control
 * sits inside.
 */
function carrierOf(control, scope) {
  if (control.id) {
    for (const el of scope.querySelectorAll("[for]")) {
      if (el.getAttribute("for") === control.id) return el;
    }
  }
  const parent = control.parentElement;
  if (parent && parent.querySelectorAll("input,select,textarea,button").length === 1) return parent;
  const next = control.nextElementSibling;
  if (next && next.tagName === "LABEL") return next;
  return null;
}

/** Is this control in a state of its own? */
const isSelected = (el) => Boolean(el.querySelector(":checked, [aria-selected='true'], [aria-checked='true']"));
const isDisabled = (el) => Boolean(el.matches(":disabled") || el.querySelector(":disabled"));

// --- the check ----------------------------------------------------------------

/**
 * A selected thing that looks exactly like every unselected one.
 *
 * The comparison is made between the carrier of a selected control and its
 * twins — the siblings of the same shape that carry no state of their own.
 *
 * The finding is not that one twin matches. It is that *every* twin matches:
 * the reader picks something and nothing on the screen changes. A rating is
 * the case that shows why the distinction matters. Three of its five stars
 * are filled, so the checked star looks exactly like the two filled stars
 * beside it — and that is right, because what the reader sees is a count, not
 * a highlight. The rating is broken when the empty stars look like the filled
 * ones too, and then every twin matches.
 */
function checkStateVisible(scope, component, rows) {
  const controls = scope.querySelectorAll(
    "input:checked, [aria-selected='true'], [aria-checked='true']",
  );
  for (const control of controls) {
    const carrier = carrierOf(control, scope);
    if (!carrier || !carrier.parentElement) continue;

    const parent = carrier.parentElement;
    const twins = [...parent.children].filter(
      (c) => c !== carrier && c.tagName === carrier.tagName && c.className === carrier.className,
    );
    if (!twins.length) continue;

    const mine = signature(carrier);
    const unselected = twins.filter((t) => !isSelected(t) && !isDisabled(t));
    if (!unselected.length) continue;

    if (unselected.every((twin) => signature(twin) === mine)) {
      rows.push({
        component,
        check: "state-invisible",
        element: label(carrier),
        detail: `the selected state paints exactly like every unselected one (${label(unselected[0])})`,
      });
    }
  }
}

// --- the run ------------------------------------------------------------------

const stage = document.getElementById("stage");
const summary = document.getElementById("summary");
const tbody = document.querySelector("#report tbody");

const catalogue = await fetch("/components/index.json").then((r) => r.json());
const themeIndex = await fetch("/themes/index.json").then((r) => r.json());
document.documentElement.setAttribute("data-um-theme", themeIndex.themes[0].id);

const rows = [];
let measurements = 0;

for (const c of catalogue.components) {
  const html = await fetch(`/site/component/${c.id}.html`).then((r) => r.text());
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = document.createElement("section");
  for (const demo of doc.querySelectorAll(".example__demo")) {
    const box = document.createElement("div");
    box.append(...demo.cloneNode(true).childNodes);
    section.append(box);
  }
  stage.replaceChildren(section);
  measurements += section.querySelectorAll("input:checked, [aria-selected='true'], [aria-checked='true']").length;
  checkStateVisible(section, c.id, rows);
}

stage.replaceChildren();

for (const row of rows) {
  const tr = document.createElement("tr");
  tr.className = "fail";
  for (const key of ["component", "check", "element", "detail"]) {
    const td = document.createElement("td");
    td.textContent = String(row[key]);
    tr.append(td);
  }
  tbody.append(tr);
}

summary.textContent =
  `components: ${catalogue.components.length}\n` +
  `states found: ${measurements}\n` +
  `failures: ${rows.length}\n` +
  (rows.length
    ? "\n" + rows.slice(0, 40).map((r) => `${r.component} ${r.check} ${r.element} ${r.detail}`).join("\n")
    : "");

window.__PROBE__ = { measurements, failures: rows.length, rows };
document.title = `probe · ${measurements} states · ${rows.length} failures`;
</script>
</body>
</html>
