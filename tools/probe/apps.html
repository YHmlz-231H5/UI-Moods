<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ui-moods · app contrast probe</title>

<!-- The app packs are the other half of what this repository renders: a
     library of real product screens, built from a mood's own tokens rather
     than from the component layer's roles. They were never measured — the
     documentation used to say an app pack "inherits its mood's contrast
     guarantees" and stopped there.

     This probe measures them. It loads every screen of every app pack into
     an iframe, walks the document, and reports the colours the browser
     actually painted. A failure is attributed to the mood token it came
     from, because that is the question the number answers: is the screen
     unreadable because the *mood* is too faint, or because the generator
     painted it wrong? -->

<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 16px; background: var(--um-bg-page); color: var(--um-text-regular); }
  h1 { font-size: 15px; margin: 0 0 8px; color: var(--um-text-primary); }
  #summary { font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; color: var(--um-text-regular); }
  #report { font-size: 11px; border-collapse: collapse; width: 100%; }
  #report th, #report td { border: 1px solid var(--um-border-base); padding: 3px 6px; text-align: left; vertical-align: top; }
  #report th { background: var(--um-fill-light); color: var(--um-text-primary); position: sticky; top: 0; }
  .fail { background: var(--um-color-danger-soft-4); }
  #frames { position: absolute; left: -99999px; top: 0; }
  iframe { width: 420px; height: 900px; border: 0; }
  #stage *, #stage *::before, #stage *::after { transition: none !important; animation: none !important; }
</style>

<link rel="stylesheet" href="/themes/all.css" />
</head>
<body>

<h1>ui-moods · app contrast probe</h1>
<div id="summary">running…</div>
<table id="report"><thead><tr><th>app</th><th>screen</th><th>element</th><th>fg</th><th>bg</th><th>ratio</th><th>need</th><th>token</th><th>text</th></tr></thead><tbody></tbody></table>

<div id="frames"></div>

<script type="module">
// --- colour maths (the same maths the component probe uses) ----------------

function parse(value) {
  const s = String(value).trim();
  if (!s) return null;
  const m = s.match(/rgba?\(([^)]+)\)/);
  if (m) {
    const parts = m[1].split(/[\s,\/]+/).filter(Boolean).map(Number);
    return { r: parts[0], g: parts[1], b: parts[2], a: parts.length > 3 ? parts[3] : 1 };
  }
  const h = s.match(/^#([0-9a-f]{3,8})$/i);
  if (h) {
    const digits = h[1].length <= 4 ? h[1].split("").map((c) => c + c).join("") : h[1];
    return {
      r: parseInt(digits.slice(0, 2), 16),
      g: parseInt(digits.slice(2, 4), 16),
      b: parseInt(digits.slice(4, 6), 16),
      a: digits.length >= 8 ? parseInt(digits.slice(6, 8), 16) / 255 : 1,
    };
  }
  return null;
}

function over(fg, bg) {
  const a = fg.a;
  return { r: fg.r * a + bg.r * (1 - a), g: fg.g * a + bg.g * (1 - a), b: fg.b * a + bg.b * (1 - a), a: 1 };
}

function luminance({ r, g, b }) {
  const f = (v) => {
    const s = v / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}

function ratio(fg, bg) {
  const l1 = luminance(fg);
  const l2 = luminance(bg);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}

const hex = (c) =>
  "#" + [c.r, c.g, c.b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");

const rectIntersects = (a, b) =>
  a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;

/** The canvas colour of a document: the body's background propagates to it. */
function canvasColor(doc) {
  const white = { r: 255, g: 255, b: 255, a: 1 };
  const html = parse(doc.defaultView.getComputedStyle(doc.documentElement).backgroundColor);
  if (html && html.a > 0) return over(html, white);
  const body = parse(doc.defaultView.getComputedStyle(doc.body).backgroundColor);
  if (body && body.a > 0) return over(body, white);
  return white;
}

/** The effective background of an element inside a document. */
function effectiveBackground(doc, el) {
  const layers = [];
  let node = el;
  let rect = el.getBoundingClientRect();
  while (node && node.nodeType === 1 && node !== doc.body && node !== doc.documentElement) {
    const style = doc.defaultView.getComputedStyle(node);
    // A background image paints over the background colour, and a gradient is
    // not a colour: there is no single value to measure against. An element
    // that sits on one cannot be measured, and pretending otherwise would
    // report a white heading on a dark artwork panel as white on white.
    if (style.backgroundImage && style.backgroundImage !== "none") return null;
    const own = parse(style.backgroundColor);
    const box = node.getBoundingClientRect();
    // A clipping ancestor — a scroll box — holds its content inside its own
    // box: the content is painted over that background whether or not the
    // content's own rectangle reaches that far, because scrolling moves the
    // content and not the background. Past the clip, the content's position
    // stops mattering and the clip's own box takes over.
    const clips = style.overflowX !== "visible" || style.overflowY !== "visible";
    const behind = clips || box.width === 0 || box.height === 0 || rectIntersects(rect, box);
    if (own && own.a > 0 && behind) layers.push(own);
    if (own && own.a >= 1) break;
    if (clips) rect = box;
    node = node.parentElement;
  }
  let result = canvasColor(doc);
  for (let i = layers.length - 1; i >= 0; i--) result = over(layers[i], result);
  return { ...result, a: 1 };
}

function ownText(el) {
  let out = "";
  for (const node of el.childNodes) if (node.nodeType === 3) out += node.textContent;
  return out.trim();
}

/**
 * Which custom properties hold this colour?
 *
 * The app layer paints with `--mood-*` variables, so a failing colour can be
 * traced back to the tokens that produced it. A colour can be held by more
 * than one token, and the stylesheet is what says which one was used — the
 * computed style cannot. So every candidate is listed: the list is the truth
 * the measurement can support, and picking one of them would be a guess.
 */
function tokensFor(doc, colour) {
  const style = doc.defaultView.getComputedStyle(doc.documentElement);
  const found = [];
  for (let i = 0; i < style.length; i++) {
    const name = style[i];
    if (!name.startsWith("--mood-")) continue;
    const value = parse(style.getPropertyValue(name));
    if (!value || value.a === 0) continue;
    const flat = over(value, { r: 255, g: 255, b: 255, a: 1 });
    if (flat.r === colour.r && flat.g === colour.g && flat.b === colour.b) found.push(name);
  }
  return found.length ? found.join(" | ") : "(not a token)";
}

// --- the run -----------------------------------------------------------------

const summary = document.getElementById("summary");
const tbody = document.querySelector("#report tbody");
const frames = document.getElementById("frames");

const registry = await fetch("/apps.json").then((r) => r.json());

/** Load a document into an iframe and wait for it to settle. */
async function load(html) {
  const frame = document.createElement("iframe");
  frames.append(frame);
  await new Promise((resolve) => {
    frame.onload = resolve;
    frame.srcdoc = html;
  });
  await new Promise((resolve) => requestAnimationFrame(resolve));
  return frame;
}

const rows = [];
let measurements = 0;
let unmeasurable = 0;
let screens = 0;

for (const app of registry.apps ?? []) {
  const manifest = await fetch(`/apps/${app.id}/app.json`).then((r) => r.json());
  for (const screen of manifest.screens ?? []) {
    const html = await fetch(`/apps/${app.id}/screens/${screen.id}.html`).then((r) => r.text());
    const frame = await load(html);
    const doc = frame.contentDocument;
    screens++;

    for (const el of doc.querySelectorAll("*")) {
      const text = ownText(el);
      if (!text) continue;
      const style = frame.contentWindow.getComputedStyle(el);
      if (style.display === "none" || style.visibility === "hidden") continue;
      const rect = el.getBoundingClientRect();
      if (rect.width === 0 && rect.height === 0) continue;
      const fg = parse(style.color);
      if (!fg || fg.a === 0) continue;
      const bg = effectiveBackground(doc, el);
      if (!bg) {
        unmeasurable++;
        continue;
      }
      const composite = fg.a < 1 ? over(fg, bg) : fg;
      const size = parseFloat(style.fontSize);
      const weight = parseInt(style.fontWeight, 10) || 400;
      const need = size >= 24 || (size >= 18.66 && weight >= 700) ? 3 : 4.5;
      const r = ratio(composite, bg);
      measurements++;
      if (r < need) {
        rows.push({
          app: app.id,
          screen: screen.id,
          element: el.tagName.toLowerCase() + "." + (el.className || "").toString().replace(/\s+/g, ".").slice(0, 60),
          fg: hex(composite),
          bg: hex(bg),
          ratio: Number(r.toFixed(2)),
          need,
          token: tokensFor(doc, composite),
          text: text.slice(0, 30),
        });
      }
    }
    frame.remove();
  }
}

for (const row of rows) {
  const tr = document.createElement("tr");
  tr.className = "fail";
  for (const key of ["app", "screen", "element", "fg", "bg", "ratio", "need", "token", "text"]) {
    const td = document.createElement("td");
    td.textContent = String(row[key]);
    tr.append(td);
  }
  tbody.append(tr);
}

// --- the report ---------------------------------------------------------------

const byToken = new Map();
for (const r of rows) {
  const entry = byToken.get(r.token) ?? { count: 0, worst: Infinity };
  entry.count++;
  entry.worst = Math.min(entry.worst, r.ratio);
  byToken.set(r.token, entry);
}

summary.textContent =
  `apps: ${(registry.apps ?? []).length}\n` +
  `screens: ${screens}\n` +
  `measurements: ${measurements}\n` +
  `unmeasurable (a gradient behind): ${unmeasurable}\n` +
  `failures: ${rows.length}\n` +
  (byToken.size
    ? "\nby token:\n" +
      [...byToken.entries()]
        .sort((a, b) => b[1].count - a[1].count)
        .map(([name, e]) => `  ${name}: ${e.count} failures, worst ${e.worst.toFixed(2)}`)
        .join("\n")
    : "");

window.__PROBE__ = { measurements, failures: rows.length, unmeasurable, screens, rows };
document.title = `probe · ${measurements} measurements · ${rows.length} failures`;
</script>
</body>
</html>
