<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ui-moods · app contrast probe</title>

<!-- The app packs are the other half of what this repository renders: a
     library of real product screens, built from a mood's own tokens rather
     than from the component layer's roles. They were never measured — the
     documentation used to say an app pack "inherits its mood's contrast
     guarantees" and stopped there.

     This probe measures them. It loads every screen of every app pack into
     an iframe, walks the document, and reports the colours the browser
     actually painted. A failure is attributed to the mood token it came
     from, because that is the question the number answers: is the screen
     unreadable because the *mood* is too faint, or because the generator
     painted it wrong?

     The measurement is shared with the specimen probe: the two are built
     from the same templates, so they are measured by the same code. -->

<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 16px; background: var(--um-bg-page); color: var(--um-text-regular); }
  h1 { font-size: 15px; margin: 0 0 8px; color: var(--um-text-primary); }
  #summary { font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; color: var(--um-text-regular); }
  #report { font-size: 11px; border-collapse: collapse; width: 100%; }
  #report th, #report td { border: 1px solid var(--um-border-base); padding: 3px 6px; text-align: left; vertical-align: top; }
  #report th { background: var(--um-fill-light); color: var(--um-text-primary); position: sticky; top: 0; }
  .fail { background: var(--um-color-danger-soft-4); }
  #frames { position: absolute; left: -99999px; top: 0; }
  iframe { width: 420px; height: 900px; border: 0; }
  #stage *, #stage *::before, #stage *::after { transition: none !important; animation: none !important; }
</style>

<link rel="stylesheet" href="/themes/all.css" />
</head>
<body>

<h1>ui-moods · app contrast probe</h1>
<div id="summary">running…</div>
<table id="report"><thead><tr><th>app</th><th>screen</th><th>element</th><th>fg</th><th>bg</th><th>ratio</th><th>need</th><th>token</th><th>text</th></tr></thead><tbody></tbody></table>

<div id="frames"></div>

<script type="module">
import { measureMoodPages, renderReport, summarise } from "./mood-measure.js";

const registry = await fetch("/apps.json").then((r) => r.json());

const pages = [];
for (const app of registry.apps ?? []) {
  const manifest = await fetch(`/apps/${app.id}/app.json`).then((r) => r.json());
  for (const screen of manifest.screens ?? []) {
    const html = await fetch(`/apps/${app.id}/screens/${screen.id}.html`).then((r) => r.text());
    pages.push({ group: app.id, page: screen.id, html });
  }
}

const result = await measureMoodPages(pages);

renderReport(result.rows, ["group", "page", "element", "fg", "bg", "ratio", "need", "token", "text"]);

document.getElementById("summary").textContent = summarise(result, [
  `apps: ${(registry.apps ?? []).length}`,
]);

window.__PROBE__ = result;
document.title = `probe · ${result.measurements} measurements · ${result.failures} failures`;
</script>
</body>
</html>
