<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ui-moods · motion probe</title>

<!-- The probe is a measuring instrument, not a page anybody looks at.

     It answers one question: when a reader has asked the system for less
     motion, does the library stop moving?

     The answer has to be measured rather than argued, because the contract is
     a cascade question — a rule only wins if it wins. So the probe loads the
     library, walks every element the library paints, and reads the durations
     the browser actually computed.

     Run it twice: once as it is, and once with the browser told that the
     reader has asked for reduced motion (`audit-render motion
     --reduced-motion`). The second run is the one that can fail. -->

<link rel="stylesheet" href="/components/um-components.css" />
<link rel="stylesheet" href="/themes/all.css" />

<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 16px; background: var(--um-bg-page); color: var(--um-text-regular); }
  h1 { font-size: 15px; margin: 0 0 8px; color: var(--um-text-primary); }
  #summary { font-size: 13px; margin: 0 0 12px; white-space: pre-wrap; color: var(--um-text-regular); }
  #stage { position: absolute; left: -99999px; top: 0; width: 1200px; background: var(--um-bg-page); }
  #stage * { content-visibility: visible !important; }
</style>
</head>
<body>

<h1>ui-moods · motion probe</h1>
<div id="summary">running…</div>

<div id="stage"></div>

<script type="module">
// The preference as the browser sees it. The probe only holds the library to
// the contract when the reader has actually asked for it — otherwise it is
// measuring the baseline, and a baseline is not a failure.
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// A hundredth of a millisecond, in seconds. The contract does not set the
// duration to zero, because a zero-length transition never fires
// `transitionend`; this is the threshold under which nothing visibly moves.
const STILL = 0.001;

const stage = document.getElementById("stage");
const catalogue = await fetch("/components/index.json").then((r) => r.json());

const chunks = [];
for (const c of catalogue.components) {
  const html = await fetch(`/site/component/${c.id}.html`).then((r) => r.text());
  const doc = new DOMParser().parseFromString(html, "text/html");
  const section = document.createElement("section");
  section.dataset.component = c.id;
  for (const demo of doc.querySelectorAll(".example__demo")) {
    const box = document.createElement("div");
    box.className = "probe__demo";
    box.append(...demo.cloneNode(true).childNodes);
    section.append(box);
  }
  chunks.push(section);
}

/**
 * The longest duration in a comma-separated list of times.
 *
 * `transition-duration` can name several durations — one per property — so
 * the worst one is the one that matters.
 */
function longest(value) {
  return String(value)
    .split(",")
    .map((part) => {
      const s = part.trim();
      if (s.endsWith("ms")) return parseFloat(s) / 1000;
      if (s.endsWith("s")) return parseFloat(s);
      return 0;
    })
    .reduce((a, b) => Math.max(a, b), 0);
}

const rows = [];
let measurements = 0;
let moving = 0;
let timed = 0;

for (const section of chunks) {
  stage.replaceChildren(section);
  const id = section.dataset.component;
  for (const el of section.querySelectorAll("*")) {
    // Only the library's own elements are measured. A host's elements are
    // none of the library's business.
    const owns = [...el.classList].some((cls) => cls.startsWith("um-"));
    if (!owns) continue;
    const style = getComputedStyle(el);
    const transition = longest(style.transitionDuration);
    const animation = longest(style.animationDuration);
    const transitionDelay = longest(style.transitionDelay);
    const animationDelay = longest(style.animationDelay);
    measurements++;
    const worst = Math.max(transition + transitionDelay, animation + animationDelay);
    // Two counts, not one. A duration of a hundredth of a millisecond is the
    // contract's own value: something is declared, and it is not long enough
    // to be seen. A duration past the threshold is motion the reader can see.
    if (worst > 0) timed++;
    if (worst > STILL) moving++;
    if (reduced && worst > STILL) {
      rows.push({
        theme: "reduced",
        component: id,
        element: el.tagName.toLowerCase() + "." + [...el.classList].join("."),
        detail: `moves for ${worst}s`,
      });
    }
  }
}

stage.replaceChildren();

const report = {
  measurements,
  failures: rows.length,
  rows,
  reduced,
  moving,
  timed,
};

document.getElementById("summary").textContent =
  `reduced motion: ${reduced}\n` +
  `elements measured: ${measurements}\n` +
  `elements with a declared duration: ${timed}\n` +
  `elements that visibly move: ${moving}\n` +
  `failures: ${rows.length}\n` +
  (rows.length
    ? "\n" + rows.slice(0, 40).map((r) => `${r.component} ${r.element} — ${r.detail}`).join("\n")
    : "");

window.__PROBE__ = report;
document.title = `probe · ${measurements} measurements · ${rows.length} failures`;
</script>
</body>
</html>
