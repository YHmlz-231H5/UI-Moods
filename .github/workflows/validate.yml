name: validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Generated artifacts must be committed together with their source, so
      # a stale specimen or screen is a hard failure rather than a warning.
      - name: Verify generated artifacts are up to date
        run: |
          npm run build:all
          git diff --exit-code --stat -- moods apps

      - name: Validate registry
        run: npm run validate
