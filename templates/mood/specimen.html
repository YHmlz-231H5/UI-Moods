<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mood Specimen · {{id}}</title>
  <!--
    Mood specimen template — SHELL.
    - Section content lives in templates/mood/sections/*.html and is injected
      at the sections marker inside the body below, ordered by filename.
      (The marker token is deliberately not spelled out here: build-specimen
      targets the last occurrence, and a literal copy in this comment would
      be an easy way to inject the sections into <head> by mistake.)
    - CSS uses var(--mood-*) only. The style block with id "mood-tokens" is
      the single injection point: build-specimen replaces it from tokens.json.
    - Placeholders {{id}} / {{name}} / {{keywords}} are filled by build-specimen.
    - No inline executable scripts (community mood safety).
  -->
  <style id="mood-tokens">
    /* TEMPLATE DEFAULTS — replaced by build-specimen from tokens.json */
    :root {
      --mood-colors-bg: #f5f5f5;
      --mood-colors-panel: #ffffff;
      --mood-colors-surface: #ffffff;
      --mood-colors-text: #333333;
      --mood-colors-text-strong: #111111;
      --mood-colors-muted: #888888;
      --mood-colors-border: #dddddd;
      --mood-colors-accent: #2e7d5b;
      --mood-colors-on-accent: #ffffff;
      --mood-colors-ok: #2fb96e;
      --mood-colors-warn: #c2913f;
      --mood-colors-danger: #b05f47;
      --mood-typography-family: system-ui, sans-serif;
      --mood-typography-display-size: 40px;
      --mood-typography-title-size: 16px;
      --mood-typography-body-size: 14px;
      --mood-typography-label-size: 11px;
      --mood-radii-block: 14px;
      --mood-radii-button: 10px;
      --mood-radii-card: 16px;
      --mood-radii-badge: 999px;
      --mood-radii-input: 10px;
      --mood-borders-width: 1px;
      --mood-borders-style: solid;
      --mood-effects-backdrop-filter: none;
      --mood-shadows-card: 0 4px 16px rgba(0,0,0,0.08);
      --mood-shadows-button: none;
      --mood-spacing-section: 28px;
      --mood-spacing-block: 18px;
      --mood-spacing-gap: 12px;
      --mood-motion-duration: 0.2s;
      --mood-motion-easing: ease;
    }
  </style>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--mood-colors-bg);
      color: var(--mood-colors-text);
      font-family: var(--mood-typography-family);
      font-size: var(--mood-typography-body-size);
      line-height: 1.65;
    }
    .hero {
      padding: 48px 36px;
      border-bottom: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      background: var(--mood-colors-panel);
    }
    .hero .label {
      font-size: var(--mood-typography-label-size);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mood-colors-accent);
      margin-bottom: 8px;
    }
    .hero h1 {
      margin: 0;
      font-size: var(--mood-typography-display-size);
      color: var(--mood-colors-text-strong);
    }
    .hero p { max-width: 640px; color: var(--mood-colors-muted); }
    .hero .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .hero .hero-meta span {
      font-size: var(--mood-typography-label-size);
      padding: 3px 10px;
      border-radius: var(--mood-radii-badge);
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      color: var(--mood-colors-muted);
    }
    .kit { padding: 28px 36px 48px; display: flex; flex-direction: column; gap: 28px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--mood-spacing-gap); }
    .row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .row.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .section-label {
      font-size: var(--mood-typography-label-size);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mood-colors-muted);
      margin-bottom: 10px;
    }
    .block {
      padding: var(--mood-spacing-block);
      background: var(--mood-colors-surface);
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-block);
      backdrop-filter: var(--mood-effects-backdrop-filter, none);
    }
    .block.tint { background: var(--mood-colors-panel); }
    .block.flush { padding: 0; overflow: hidden; }
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch { width: 72px; }
    .chip { height: 44px; border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border); border-radius: var(--mood-radii-input); margin-bottom: 6px; }
    .swatch .name { font-size: 10px; opacity: 0.75; }
    .swatch .hex { font-size: 10px; opacity: 0.45; }
    .type-stack { display: flex; flex-direction: column; gap: 10px; }
    .type-row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; align-items: baseline; }
    .type-row .spec { font-size: 10px; opacity: 0.45; }
    .type-row .display { font-size: var(--mood-typography-display-size); color: var(--mood-colors-text-strong); }
    .type-row .title { font-size: var(--mood-typography-title-size); color: var(--mood-colors-text-strong); font-weight: 600; }
    .logo-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; }
    .logo-mark { display: flex; align-items: center; gap: 10px; }
    .logo-mark .glyph {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: var(--mood-colors-accent);
      color: var(--mood-colors-on-accent, var(--mood-colors-surface));
      border-radius: var(--mood-radii-button);
      font-weight: 700;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      font: inherit;
      padding: 8px 16px;
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-button);
      background: var(--mood-colors-surface);
      color: var(--mood-colors-accent);
      box-shadow: var(--mood-shadows-button);
      cursor: default;
    }
    button.primary { background: var(--mood-colors-accent); border-color: var(--mood-colors-accent); color: var(--mood-colors-on-accent, var(--mood-colors-surface)); }
    button.ok { background: var(--mood-colors-ok); border-color: var(--mood-colors-ok); color: var(--mood-colors-on-accent, var(--mood-colors-surface)); }
    button.danger { background: var(--mood-colors-danger); border-color: var(--mood-colors-danger); color: var(--mood-colors-on-accent, var(--mood-colors-surface)); }
    button:disabled { opacity: 0.4; }
    .badge {
      display: inline-flex; align-items: center;
      font-size: 11px; padding: 3px 10px;
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-badge);
      background: var(--mood-colors-surface);
      color: var(--mood-colors-text);
    }
    .badge.live { background: var(--mood-colors-accent); border-color: var(--mood-colors-accent); color: var(--mood-colors-on-accent, var(--mood-colors-surface)); box-shadow: var(--mood-effects-glow, none); }
    .field-row { display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: var(--mood-typography-label-size); color: var(--mood-colors-muted); }
    .field input, .field select, .field textarea {
      font: inherit; padding: 8px 10px;
      background: var(--mood-colors-bg);
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-input);
      color: var(--mood-colors-text-strong);
      outline: none;
    }
    .field textarea { min-height: 72px; resize: vertical; }
    .bar { height: 8px; border-radius: 999px; background: var(--mood-colors-border); overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--mood-colors-accent); }
    .bar.ok > i { background: var(--mood-colors-ok); }
    .bar.warn > i { background: var(--mood-colors-warn); }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card-demo {
      padding: 16px;
      background: var(--mood-colors-surface);
      border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border);
      border-radius: var(--mood-radii-card);
      box-shadow: var(--mood-shadows-card);
      backdrop-filter: var(--mood-effects-backdrop-filter, none);
    }
    .card-demo .ct { font-size: var(--mood-typography-title-size); color: var(--mood-colors-text-strong); font-weight: 600; margin-bottom: 4px; }
    .card-demo .cm { font-size: 12px; color: var(--mood-colors-muted); margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border); }
    th { color: var(--mood-colors-muted); text-transform: uppercase; font-size: 11px; }
    .toggle-row { display: flex; flex-direction: column; gap: 12px; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch i { position: absolute; inset: 0; border-radius: 999px; background: var(--mood-colors-border); transition: background var(--mood-motion-duration) var(--mood-motion-easing); }
    .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--mood-colors-surface); transition: left var(--mood-motion-duration) var(--mood-motion-easing); }
    .switch.on i { background: var(--mood-colors-ok); }
    .switch.on i::after { left: 21px; }
    .list { display: flex; flex-direction: column; }
    .list-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border); }
    .list-item .name { color: var(--mood-colors-text-strong); font-weight: 600; }
    .list-item .sub { font-size: 11px; color: var(--mood-colors-muted); }
    .alerts { display: flex; flex-direction: column; gap: 8px; }
    .alert { display: flex; gap: 10px; padding: 12px 14px; border: var(--mood-borders-width) var(--mood-borders-style) var(--mood-colors-border); border-radius: var(--mood-radii-block); background: var(--mood-colors-surface); backdrop-filter: var(--mood-effects-backdrop-filter, none); }
    .alert .mark { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; }
    .alert.ok { border-color: var(--mood-colors-ok); color: var(--mood-colors-ok); }
    .alert.warn { border-color: var(--mood-colors-warn); color: var(--mood-colors-warn); }
    .alert.danger { border-color: var(--mood-colors-danger); color: var(--mood-colors-danger); }
    @media (max-width: 860px) {
      .row, .row.cols-3, .row.cols-4, .card-grid { grid-template-columns: 1fr; }
      .hero, .kit { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="label">Mood Specimen · {{id}}</div>
    <h1>{{name}}</h1>
    <p>Keywords: {{keywords}}</p>
    <div class="hero-meta">
      <span>Specimen v1</span>
      <span>Tokens only</span>
      <span>Agent-consumable</span>
    </div>
  </div>

  <div class="kit">
{{sections}}
  </div>
</body>
</html>
