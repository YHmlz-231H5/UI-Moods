<div>
  <div class="section-label">Logo</div>
  <div class="block">
    <div class="logo-row">
      <div class="logo-mark"><div class="glyph">M</div><div><strong>Mood</strong><br /><small>Specimen</small></div></div>
      <div class="logo-mark"><div class="glyph">U</div><div><strong>UI</strong><br /><small>Moods</small></div></div>
      <div class="logo-mark"><div class="glyph">★</div><div><strong>Example</strong><br /><small>Mark</small></div></div>
    </div>
  </div>
</div>

<div class="row">
  <div>
    <div class="section-label">Buttons</div>
    <div class="block">
      <div class="btn-row">
        <button type="button" class="primary">Primary</button>
        <button type="button">Secondary</button>
        <button type="button" class="ok">Success</button>
        <button type="button" class="danger">Danger</button>
        <button type="button" disabled>Disabled</button>
      </div>
    </div>
  </div>
  <div>
    <div class="section-label">Badges</div>
    <div class="block">
      <span class="badge live">Active</span>
      <span class="badge">Draft</span>
      <span class="badge ok">Ready</span>
      <span class="badge warn">Review</span>
      <span class="badge danger">Blocked</span>
    </div>
  </div>
</div>

<div class="row">
  <div>
    <div class="section-label">Inputs</div>
    <div class="block">
      <div class="field-row">
        <div class="field"><label>Project</label><input value="Example Project" readonly /></div>
        <div class="field"><label>Type</label><select><option>Option A</option><option>Option B</option></select></div>
        <div class="field"><label>Notes</label><textarea readonly>Sample notes area</textarea></div>
      </div>
    </div>
  </div>
  <div>
    <div class="section-label">Progress</div>
    <div class="block">
      <div class="bar" style="margin-bottom:8px"><i style="width:19%"></i></div>
      <div class="bar ok" style="margin-bottom:8px"><i style="width:62%"></i></div>
      <div class="bar warn"><i style="width:88%"></i></div>
    </div>
  </div>
</div>
